<title>Matéria em Movimento</title>
<meta name="description" content="Apresentação em WebGL sobre as oito camadas que transformam números em imagem em tempo real.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --obsidiana:#0B0A10;
    --grafite:#171522;
    --grafite-alto:#221F30;
    --nevoa:#EDE9F2;
    --nevoa-fraca:#9C96AE;
    --ambar:#FFB454;
    --viridiana:#3FCBA4;
    --linha:rgba(237,233,242,.14);
    --stack-display:"Bodoni Moda",Georgia,"Times New Roman",serif;
    --stack-corpo:"Archivo","Helvetica Neue",Arial,sans-serif;
    --stack-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
    --gap:clamp(16px,2.2vw,34px);
  }

  html,body{height:100%;}
  body{
    margin:0;
    background:var(--obsidiana);
    color:var(--nevoa);
    font-family:var(--stack-corpo);
    font-size:16px;
    line-height:1.55;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--ambar);color:var(--obsidiana);}
  :focus-visible{outline:2px solid var(--ambar);outline-offset:3px;border-radius:2px;}

  /* ---------- palco ---------- */
  #palco{position:fixed;inset:0;display:block;}
  #veu{
    position:fixed;inset:0;pointer-events:none;z-index:4;
    background:
      linear-gradient(100deg,rgba(11,10,16,.94) 0%,rgba(11,10,16,.86) 26%,rgba(11,10,16,.35) 52%,transparent 70%),
      radial-gradient(120% 90% at 55% 50%,transparent 26%,rgba(11,10,16,.78) 100%);
  }
  #corte{
    position:fixed;inset:0;pointer-events:none;z-index:6;
    background:var(--obsidiana);opacity:0;
    transition:opacity .26s ease;
  }
  #corte.ativo{opacity:1;}
  .grao{
    position:fixed;inset:0;z-index:5;pointer-events:none;opacity:.28;mix-blend-mode:overlay;
    background-image:radial-gradient(rgba(255,255,255,.55) .5px,transparent .5px);
    background-size:3px 3px;
  }

  /* ---------- moldura ---------- */
  .moldura{position:fixed;inset:0;z-index:8;pointer-events:none;}
  .canto{position:absolute;width:26px;height:26px;border:1px solid var(--linha);}
  .canto.tl{top:18px;left:18px;border-right:0;border-bottom:0;}
  .canto.tr{top:18px;right:18px;border-left:0;border-bottom:0;}
  .canto.bl{bottom:18px;left:18px;border-right:0;border-top:0;}
  .canto.br{bottom:18px;right:18px;border-left:0;border-top:0;}

  /* ---------- grade de conteúdo ---------- */
  #deck{
    position:fixed;inset:0;z-index:7;
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    grid-template-rows:auto 1fr auto;
    gap:var(--gap);
    padding:clamp(30px,4.2vw,66px);
    pointer-events:none;
  }
  #deck > *{pointer-events:auto;}

  .fita{
    grid-column:1/-1;
    display:flex;align-items:baseline;gap:18px;
    font-family:var(--stack-mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--nevoa-fraca);
  }
  .fita .marca{color:var(--nevoa);letter-spacing:.3em;}
  .fita .risco{flex:1;height:1px;background:var(--linha);}
  .fita .ambar{color:var(--ambar);}

  main{
    grid-column:1;grid-row:2;
    display:flex;flex-direction:column;justify-content:center;
    max-width:min(54ch,64vw);
  }

  .capitulo{
    font-family:var(--stack-mono);font-size:11px;letter-spacing:.3em;text-transform:uppercase;
    color:var(--ambar);display:flex;align-items:center;gap:12px;margin:0 0 18px;
  }
  .capitulo::after{content:"";width:56px;height:1px;background:var(--ambar);opacity:.5;}

  h1,h2{
    font-family:var(--stack-display);
    font-weight:400;font-style:normal;
    line-height:1.02;letter-spacing:-.015em;
    text-wrap:balance;margin:0;
  }
  h1{font-size:clamp(40px,6.1vw,92px);}
  h2{font-size:clamp(31px,4.4vw,66px);}
  h1 em,h2 em{font-style:italic;color:var(--ambar);}

  .subtitulo{
    margin:clamp(18px,2vw,28px) 0 0;
    font-size:clamp(15px,1.25vw,19px);
    color:var(--nevoa);opacity:.82;max-width:46ch;
  }
  .nota{
    margin:22px 0 0;font-family:var(--stack-mono);font-size:12.5px;line-height:1.7;
    color:var(--nevoa-fraca);border-left:1px solid var(--linha);padding-left:16px;max-width:44ch;
  }
  .nota b{color:var(--viridiana);font-weight:500;}

  /* revelação por linha */
  .rev{display:block;overflow:hidden;padding:.06em .1em .06em 0;margin:-.06em 0;}
  .rev > span{
    display:block;
    transform:translateY(105%) rotate(2.2deg);
    opacity:0;
    transition:transform .82s cubic-bezier(.16,1,.3,1),opacity .82s ease;
  }
  .slide-ativo .rev > span{transform:none;opacity:1;}
  .slide-ativo .subtitulo,.slide-ativo .capitulo,.slide-ativo .nota{animation:sobe .7s cubic-bezier(.16,1,.3,1) both;}
  .slide-ativo .capitulo{animation-delay:.05s;}
  .slide-ativo .subtitulo{animation-delay:.34s;}
  .slide-ativo .nota{animation-delay:.46s;}
  @keyframes sobe{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}

  .slide{display:none;}
  .slide.slide-ativo{display:block;}

  /* ---------- telemetria ---------- */
  .telemetria{
    grid-column:2;grid-row:2;
    align-self:center;
    display:flex;flex-direction:column;gap:14px;
    font-family:var(--stack-mono);font-size:11px;letter-spacing:.08em;
    color:var(--nevoa-fraca);
    border-left:1px solid var(--linha);padding-left:16px;min-width:172px;
  }
  .telemetria .rot{display:block;font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;opacity:.65;}
  .telemetria .val{color:var(--nevoa);font-size:15px;font-variant-numeric:tabular-nums;}
  .telemetria .val.verde{color:var(--viridiana);}

  /* ---------- rodapé / controles ---------- */
  .rodape{
    grid-column:1/-1;grid-row:3;
    display:flex;align-items:center;gap:var(--gap);flex-wrap:wrap;
  }
  .marcas{display:flex;gap:7px;align-items:flex-end;flex:1;min-width:180px;}
  .marca-slide{
    appearance:none;border:0;padding:0;background:transparent;cursor:pointer;
    width:34px;height:22px;display:flex;align-items:flex-end;
  }
  .marca-slide i{display:block;width:100%;height:2px;background:var(--linha);transition:height .3s ease,background .3s ease;}
  .marca-slide[aria-current="true"] i{height:12px;background:var(--ambar);}
  .marca-slide:hover i{background:var(--nevoa);}

  .controles{display:flex;align-items:center;gap:10px;}
  .btn{
    appearance:none;cursor:pointer;
    background:transparent;color:var(--nevoa);
    border:1px solid var(--linha);border-radius:999px;
    font-family:var(--stack-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    padding:9px 16px;transition:border-color .25s,color .25s,background .25s;
  }
  .btn:hover{border-color:var(--ambar);color:var(--ambar);}
  .btn.circulo{width:40px;height:40px;padding:0;display:grid;place-items:center;font-size:15px;letter-spacing:0;}
  .btn[aria-pressed="true"]{background:var(--ambar);border-color:var(--ambar);color:var(--obsidiana);}

  .barra{
    position:fixed;left:0;top:0;height:2px;z-index:9;
    background:linear-gradient(90deg,var(--viridiana),var(--ambar));
    width:0;transition:width .3s linear;
  }

  .dica{
    font-family:var(--stack-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--nevoa-fraca);
  }
  kbd{
    font-family:var(--stack-mono);border:1px solid var(--linha);border-bottom-width:2px;
    border-radius:4px;padding:1px 6px;color:var(--nevoa);font-size:10.5px;
  }

  @media (max-width:860px){
    .telemetria{display:none;}
    main{max-width:none;}
    #deck{padding:clamp(22px,6vw,34px);}
    .dica{display:none;}
  }

  @media (prefers-reduced-motion:reduce){
    .rev > span{transform:none;opacity:1;transition:none;}
    .slide-ativo .subtitulo,.slide-ativo .capitulo,.slide-ativo .nota{animation:none;}
    #corte{transition:none;}
  }
</style>

<canvas id="palco" aria-hidden="true"></canvas>
<div id="veu" aria-hidden="true"></div>
<div class="grao" aria-hidden="true"></div>
<div id="corte" aria-hidden="true"></div>
<div class="moldura" aria-hidden="true">
  <span class="canto tl"></span><span class="canto tr"></span>
  <span class="canto bl"></span><span class="canto br"></span>
</div>
<div class="barra" id="barra" aria-hidden="true"></div>

<div id="deck">
  <div class="fita">
    <span class="marca">Matéria em Movimento</span>
    <span class="risco"></span>
    <span>Oito camadas entre o número e a imagem</span>
    <span class="ambar" id="contador">01 / 08</span>
  </div>

  <main id="palcoTexto" aria-live="polite"></main>

  <aside class="telemetria" id="telemetria" aria-hidden="true"></aside>

  <div class="rodape">
    <div class="marcas" id="marcas" role="tablist" aria-label="Ir para o slide"></div>
    <span class="dica">Navegue com <kbd>←</kbd> <kbd>→</kbd> ou <kbd>espaço</kbd></span>
    <div class="controles">
      <button class="btn circulo" id="anterior" type="button" aria-label="Slide anterior">‹</button>
      <button class="btn" id="auto" type="button" aria-pressed="false">Auto</button>
      <button class="btn circulo" id="proximo" type="button" aria-label="Próximo slide">›</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  "use strict";

  var reduzir = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var AMBAR = 0xffb454, VIRIDIANA = 0x3fcba4, OBSIDIANA = 0x0b0a10, NEVOA = 0xede9f2;

  /* ============================================================
     CONTEÚDO
     ============================================================ */
  var slides = [
    {
      capitulo:"Abertura",
      titulo:["Matéria", "em <em>Movimento</em>"],
      subtitulo:"Um giro por oito camadas de geometria em tempo real — malha, normal, instância, partícula. Tudo o que você vê atrás deste texto é calculado agora, quadro a quadro.",
      nota:"Renderizador <b>WebGL</b> · alvo de <b>60 fps</b> · nenhum vídeo, nenhuma imagem.",
      telemetria:[["Cena","Nó de toro"],["Primitiva","TorusKnot 2,3"],["Segmentos","320 × 42"]]
    },
    {
      capitulo:"Camada 01 — A malha",
      titulo:["Tudo começa","com <em>vértices</em>"],
      subtitulo:"Um sólido em 3D não passa de uma lista de pontos e a regra que diz quais deles formam triângulos. O icosaedro é o poliedro regular com mais faces — e o melhor ponto de partida para aproximar uma esfera.",
      nota:"12 vértices · 20 faces · subdivisão nível 2 → <b>180 triângulos</b>, 540 pontos.",
      telemetria:[["Cena","Icosaedro"],["Arestas","LineSegments"],["Triângulos","180"]]
    },
    {
      capitulo:"Camada 02 — Normais e luz",
      titulo:["A luz só","sabe da <em>normal</em>"],
      subtitulo:"Cada vértice carrega um vetor perpendicular à superfície. O produto escalar entre ele e a direção da luz é, literalmente, o brilho daquele ponto. Deslocamos os vértices por ruído e as normais recalculadas fazem o resto.",
      nota:"Ruído simplex 3D no vertex shader · <b>lambert + rim light</b> no fragmento.",
      telemetria:[["Cena","Esfera deslocada"],["Shader","GLSL próprio"],["Ruído","simplex 3D"]]
    },
    {
      capitulo:"Camada 03 — Instâncias",
      titulo:["Mil cubos,","uma <em>chamada</em>"],
      subtitulo:"Desenhar mil objetos separados custa mil conversas com a placa de vídeo. Com instancing, a GPU recebe a forma uma vez e a matriz de cada cópia — e resolve tudo em um único draw call.",
      nota:"1.024 instâncias · <b>1 draw call</b> · matriz e cor por instância.",
      telemetria:[["Cena","Grade instanciada"],["Instâncias","1.024"],["Draw calls","1"]]
    },
    {
      capitulo:"Camada 04 — Partículas",
      titulo:["Um campo","de <em>pontos</em>"],
      subtitulo:"Sem faces, sem normais: só posições e um tamanho que diminui com a distância. É a estrutura mais barata que existe — e por isso a que aguenta dezenas de milhares de elementos animados ao mesmo tempo.",
      nota:"24.000 pontos em espiral logarítmica · cor por raio · <b>additive blending</b>.",
      telemetria:[["Cena","Espiral"],["Pontos","24.000"],["Mistura","aditiva"]]
    },
    {
      capitulo:"Camada 05 — Superfície",
      titulo:["Uma grade","que <em>respira</em>"],
      subtitulo:"Um plano de 120 por 120 divisões vira relevo quando a altura de cada vértice passa a ser função do tempo e da distância ao centro. Nenhum vértice viaja pela CPU: a onda inteira mora no shader.",
      nota:"14.641 vértices · deslocamento em <b>y = sen(r − t)</b> · malha em wireframe.",
      telemetria:[["Cena","Onda paramétrica"],["Vértices","14.641"],["Custo CPU","≈ 0"]]
    },
    {
      capitulo:"Camada 06 — Profundidade",
      titulo:["A névoa","dá a <em>escala</em>"],
      subtitulo:"Sem atmosfera, longe e perto têm o mesmo peso e a imagem achata. Fog exponencial mistura a cor do objeto com a do fundo conforme a distância — e a câmera, avançando devagar, transforma isso em espaço.",
      nota:"FogExp2 densidade 0,055 · <b>dolly</b> contínuo · 240 pilares em profundidade.",
      telemetria:[["Cena","Pilares na névoa"],["Fog","Exp2 · 0,055"],["Pilares","240"]]
    },
    {
      capitulo:"Encerramento",
      titulo:["O mesmo pó,","outra <em>forma</em>"],
      subtitulo:"As mesmas partículas do quarto capítulo, agora atraídas para posições amostradas de um texto desenhado fora da tela. Nada foi criado: só reorganizado — que é, no fundo, o que todo render faz.",
      nota:"Alvos amostrados de um canvas 2D · interpolação elástica · <b>obrigado por assistir</b>.",
      telemetria:[["Cena","Convergência"],["Pontos","18.000"],["Alvo","amostra 2D"]]
    }
  ];

  /* ============================================================
     MONTAGEM DO DOM
     ============================================================ */
  var palcoTexto = document.getElementById("palcoTexto");
  var marcas = document.getElementById("marcas");
  var telemetriaEl = document.getElementById("telemetria");
  var contador = document.getElementById("contador");
  var barra = document.getElementById("barra");
  var corte = document.getElementById("corte");

  slides.forEach(function(s, i){
    var art = document.createElement("article");
    art.className = "slide";
    art.id = "slide-" + i;
    var linhas = s.titulo.map(function(l, j){
      return '<span class="rev"><span style="transition-delay:' + (0.12 + j * 0.1) + 's">' + l + "</span></span>";
    }).join("");
    var tag = i === 0 ? "h1" : "h2";
    art.innerHTML =
      '<p class="capitulo">' + s.capitulo + "</p>" +
      "<" + tag + ">" + linhas + "</" + tag + ">" +
      '<p class="subtitulo">' + s.subtitulo + "</p>" +
      '<p class="nota">' + s.nota + "</p>";
    palcoTexto.appendChild(art);

    var b = document.createElement("button");
    b.className = "marca-slide";
    b.type = "button";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-label", "Slide " + (i + 1) + ": " + s.capitulo);
    b.innerHTML = "<i></i>";
    b.addEventListener("click", function(){ irPara(i); });
    marcas.appendChild(b);
  });

  var artigos = [].slice.call(palcoTexto.children);
  var botoesMarca = [].slice.call(marcas.children);

  function pintarTelemetria(i){
    var linhas = slides[i].telemetria.map(function(par){
      return '<span><span class="rot">' + par[0] + '</span><span class="val">' + par[1] + "</span></span>";
    }).join("");
    telemetriaEl.innerHTML = linhas +
      '<span><span class="rot">Quadros</span><span class="val verde" id="fps">— fps</span></span>';
  }

  /* ============================================================
     RENDERIZADOR
     ============================================================ */
  var canvas = document.getElementById("palco");
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(OBSIDIANA, 1);

  var largura = window.innerWidth, altura = window.innerHeight;
  renderer.setSize(largura, altura, false);

  function novaCamera(z){
    var cam = new THREE.PerspectiveCamera(48, largura / altura, 0.1, 200);
    cam.position.set(0, 0, z);
    return cam;
  }

  function luzes(scene, intensidade){
    var amb = new THREE.AmbientLight(0x3a3550, 0.9);
    var chave = new THREE.PointLight(AMBAR, intensidade || 1.5, 60);
    chave.position.set(6, 5, 7);
    var contra = new THREE.PointLight(VIRIDIANA, (intensidade || 1.5) * 0.75, 60);
    contra.position.set(-7, -4, 4);
    var topo = new THREE.DirectionalLight(NEVOA, 0.35);
    topo.position.set(0, 8, 2);
    scene.add(amb, chave, contra, topo);
    return { chave: chave, contra: contra };
  }

  var RUIDO = [
    "vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}",
    "vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}",
    "vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}",
    "vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}",
    "float snoise(vec3 v){",
    "  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);",
    "  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);",
    "  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);",
    "  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;",
    "  i=mod289(i);",
    "  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));",
    "  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;",
    "  vec4 j=p-49.0*floor(p*ns.z*ns.z);",
    "  vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);",
    "  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);",
    "  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);",
    "  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));",
    "  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;",
    "  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);",
    "  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));",
    "  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;",
    "  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;",
    "  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));",
    "}"
  ].join("\n");

  /* ============================================================
     CENA 0 — NÓ DE TORO
     ============================================================ */
  function cenaNo(){
    var scene = new THREE.Scene();
    var cam = novaCamera(7.2);
    var l = luzes(scene, 2.1);

    var no = new THREE.Mesh(
      new THREE.TorusKnotGeometry(1.9, 0.52, 320, 42, 2, 3),
      new THREE.MeshStandardMaterial({ color: 0x413c63, metalness: 0.95, roughness: 0.3 })
    );
    var casca = new THREE.Mesh(
      new THREE.IcosahedronGeometry(3.9, 1),
      new THREE.MeshBasicMaterial({ color: AMBAR, wireframe: true, transparent: true, opacity: 0.12 })
    );
    var poeira = pontosEsfericos(1400, 9, 0.035, VIRIDIANA);
    scene.add(no, casca, poeira);

    return { scene: scene, camera: cam, update: function(t){
      no.rotation.set(t * 0.28, t * 0.42, 0);
      casca.rotation.set(-t * 0.09, t * 0.13, t * 0.05);
      poeira.rotation.y = t * 0.04;
      l.chave.position.set(Math.cos(t * 0.6) * 7, 5, Math.sin(t * 0.6) * 7);
      cam.position.x = Math.sin(t * 0.16) * 0.9;
      cam.position.y = Math.cos(t * 0.21) * 0.6;
      cam.lookAt(0, 0, 0);
    }};
  }

  function pontosEsfericos(n, raio, tamanho, cor){
    var pos = new Float32Array(n * 3);
    for (var i = 0; i < n; i++){
      var u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2;
      var r = raio * (0.55 + Math.random() * 0.45), s = Math.sqrt(1 - u * u);
      pos[i * 3] = r * s * Math.cos(th);
      pos[i * 3 + 1] = r * s * Math.sin(th);
      pos[i * 3 + 2] = r * u;
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    return new THREE.Points(g, materialPonto(cor, tamanho * 260, 0.7));
  }

  function materialPonto(cor, escala, opacidade){
    return new THREE.ShaderMaterial({
      uniforms: {
        u_cor: { value: new THREE.Color(cor) },
        u_px: { value: renderer.getPixelRatio() },
        u_escala: { value: escala },
        u_op: { value: opacidade }
      },
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      vertexShader: [
        "uniform float u_px; uniform float u_escala;",
        "void main(){",
        "  vec4 mv = modelViewMatrix * vec4(position, 1.0);",
        "  gl_PointSize = u_escala * u_px / -mv.z;",
        "  gl_Position = projectionMatrix * mv;",
        "}"
      ].join("\n"),
      fragmentShader: [
        "uniform vec3 u_cor; uniform float u_op;",
        "void main(){",
        "  float d = length(gl_PointCoord - 0.5);",
        "  if (d > 0.5) discard;",
        "  gl_FragColor = vec4(u_cor, smoothstep(0.5, 0.05, d) * u_op);",
        "}"
      ].join("\n")
    });
  }

  /* ============================================================
     CENA 1 — ICOSAEDRO / MALHA
     ============================================================ */
  function cenaMalha(){

  /* ============================================================
     CENA 2 — ESFERA DESLOCADA POR RUÍDO
     ============================================================ */
  function cenaRuido(){
    var scene = new THREE.Scene();
    var cam = novaCamera(6.6);

    var mat = new THREE.ShaderMaterial({
      uniforms: {
        u_t: { value: 0 },
        u_ambar: { value: new THREE.Color(AMBAR) },
        u_verde: { value: new THREE.Color(VIRIDIANA) }
      },
      vertexShader: RUIDO + [
        "uniform float u_t;",
        "varying vec3 vN; varying vec3 vP; varying float vD;",
        "void main(){",
        "  float d = snoise(normal * 1.5 + vec3(0.0, 0.0, u_t * 0.35));",
        "  float d2 = snoise(normal * 3.7 - vec3(u_t * 0.2)) * 0.35;",
        "  vD = d + d2;",
        "  vec3 p = position + normal * vD * 0.55;",
        "  vN = normalize(normalMatrix * normal);",
        "  vec4 mv = modelViewMatrix * vec4(p, 1.0);",
        "  vP = mv.xyz;",
        "  gl_Position = projectionMatrix * mv;",
        "}"
      ].join("\n"),
      fragmentShader: [
        "uniform vec3 u_ambar; uniform vec3 u_verde;",
        "varying vec3 vN; varying vec3 vP; varying float vD;",
        "void main(){",
        "  vec3 n = normalize(vN);",
        "  vec3 luz = normalize(vec3(0.7, 0.8, 0.9));",
        "  float lam = max(dot(n, luz), 0.0);",
        "  float rim = pow(1.0 - max(dot(n, normalize(-vP)), 0.0), 2.6);",
        "  vec3 base = mix(vec3(0.07, 0.06, 0.11), u_ambar, lam * 0.85);",
        "  base = mix(base, u_verde, clamp(vD * 0.5 + 0.5, 0.0, 1.0) * 0.35);",
        "  base += u_ambar * rim * 0.9;",
        "  gl_FragColor = vec4(base, 1.0);",
        "}"
      ].join("\n")
    });

    var esfera = new THREE.Mesh(new THREE.IcosahedronGeometry(2.1, 32), mat);
    var gaiola = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(3.15, 1)),
      new THREE.LineBasicMaterial({ color: VIRIDIANA, transparent: true, opacity: 0.2 })
    );
    scene.add(esfera, gaiola, pontosEsfericos(900, 8, 0.03, AMBAR));

    return { scene: scene, camera: cam, update: function(t){
      mat.uniforms.u_t.value = t;
      esfera.rotation.y = t * 0.22;
      esfera.rotation.x = Math.sin(t * 0.3) * 0.2;
      gaiola.rotation.y = -t * 0.12;
      cam.position.x = Math.sin(t * 0.25) * 1.1;
      cam.lookAt(0, 0, 0);
    }};
  }

  /* ============================================================
     CENA 3 — GRADE INSTANCIADA
     ============================================================ */
  function cenaInstancias(){
    var scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(OBSIDIANA, 0.035);
    var cam = novaCamera(0);
    cam.position.set(0, 10, 19);
    cam.lookAt(0, 0, 0);
    luzes(scene, 2.4);

    var LADO = 32, TOTAL = LADO * LADO;
    var malha = new THREE.InstancedMesh(
      new THREE.BoxGeometry(0.42, 1, 0.42),
      new THREE.MeshStandardMaterial({ metalness: 0.75, roughness: 0.35 }),
      TOTAL
    );
    var dummy = new THREE.Object3D();
    var corA = new THREE.Color(AMBAR), corB = new THREE.Color(VIRIDIANA), tmp = new THREE.Color();
    for (var i = 0; i < TOTAL; i++){
      var x = (i % LADO) - LADO / 2, z = Math.floor(i / LADO) - LADO / 2;
      tmp.copy(corB).lerp(corA, Math.min(1, Math.hypot(x, z) / 18));
      malha.setColorAt(i, tmp);
    }
    scene.add(malha);

    var chao = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 60, 1, 1),
      new THREE.MeshBasicMaterial({ color: 0x0f0e17 })
    );
    chao.rotation.x = -Math.PI / 2;
    chao.position.y = -0.9;
    scene.add(chao);

    return { scene: scene, camera: cam, update: function(t){
      for (var i = 0; i < TOTAL; i++){
        var x = (i % LADO) - LADO / 2, z = Math.floor(i / LADO) - LADO / 2;
        var r = Math.hypot(x, z);
        var h = 0.6 + Math.sin(r * 0.55 - t * 2.1) * 1.35 + Math.cos(x * 0.3 + t) * 0.35;
        dummy.position.set(x * 0.62, h / 2 - 0.9, z * 0.62);
        dummy.scale.set(1, Math.max(0.08, h), 1);
        dummy.rotation.y = t * 0.2 + r * 0.05;
        dummy.updateMatrix();
        malha.setMatrixAt(i, dummy.matrix);
      }
      malha.instanceMatrix.needsUpdate = true;
      cam.position.x = Math.sin(t * 0.18) * 13;
      cam.position.z = Math.cos(t * 0.18) * 19;
      cam.position.y = 10 + Math.sin(t * 0.3) * 2.2;
      cam.lookAt(0, 0.5, 0);
    }};
  }

  /* ============================================================
     CENA 4 — ESPIRAL DE PARTÍCULAS
     ============================================================ */
  function cenaEspiral(){
    var scene = new THREE.Scene();
    var cam = novaCamera(11);
    cam.position.set(0, 4.5, 11);
    cam.lookAt(0, 0, 0);

    var N = 24000;
    var pos = new Float32Array(N * 3), cor = new Float32Array(N * 3), rnd = new Float32Array(N);
    var a = new THREE.Color(AMBAR), b = new THREE.Color(VIRIDIANA), c = new THREE.Color();
    for (var i = 0; i < N; i++){
      var bracos = 3, ramo = (i % bracos) / bracos * Math.PI * 2;
      var raio = Math.pow(Math.random(), 0.55) * 9;
      var giro = raio * 0.38;
      var esp = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * (0.9 - raio * 0.06);
      pos[i * 3]     = Math.cos(ramo + giro) * raio + esp * 2.2;
      pos[i * 3 + 1] = esp * 1.1;
      pos[i * 3 + 2] = Math.sin(ramo + giro) * raio + esp * 2.2;
      c.copy(a).lerp(b, Math.min(1, raio / 8));
      cor[i * 3] = c.r; cor[i * 3 + 1] = c.g; cor[i * 3 + 2] = c.b;
      rnd[i] = Math.random();
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    g.setAttribute("color", new THREE.BufferAttribute(cor, 3));
    g.setAttribute("aRnd", new THREE.BufferAttribute(rnd, 1));

    var mat = new THREE.ShaderMaterial({
      uniforms: { u_t: { value: 0 }, u_px: { value: renderer.getPixelRatio() } },
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      vertexShader: [
        "uniform float u_t; uniform float u_px; attribute float aRnd;",
        "varying vec3 vCor; varying float vR;",
        "void main(){",
        "  vec3 p = position;",
        "  float r = length(p.xz);",
        "  float ang = u_t * (0.45 / (r * 0.22 + 1.0));",
        "  float s = sin(ang), c = cos(ang);",
        "  p.xz = mat2(c, -s, s, c) * p.xz;",
        "  p.y += sin(u_t * 0.9 + aRnd * 6.28) * 0.12;",
        "  vCor = color; vR = r;",
        "  vec4 mv = modelViewMatrix * vec4(p, 1.0);",
        "  gl_PointSize = (14.0 + aRnd * 22.0) * u_px / -mv.z;",
        "  gl_Position = projectionMatrix * mv;",
        "}"
      ].join("\n"),
      fragmentShader: [
        "varying vec3 vCor; varying float vR;",
        "void main(){",
        "  float d = length(gl_PointCoord - 0.5);",
        "  if (d > 0.5) discard;",
        "  float alfa = smoothstep(0.5, 0.0, d);",
        "  gl_FragColor = vec4(vCor * (1.4 - vR * 0.05), alfa * 0.85);",
        "}"
      ].join("\n"),
      vertexColors: true
    });

    var nuvem = new THREE.Points(g, mat);
    var nucleo = new THREE.Mesh(
      new THREE.SphereGeometry(0.55, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0xfff0d6 })
    );
    scene.add(nuvem, nucleo);

    return { scene: scene, camera: cam, update: function(t){
      mat.uniforms.u_t.value = t;
      nucleo.scale.setScalar(1 + Math.sin(t * 2.2) * 0.06);
      cam.position.y = 4.5 + Math.sin(t * 0.22) * 2.4;
      cam.position.x = Math.sin(t * 0.13) * 3;
      cam.lookAt(0, 0, 0);
    }};
  }

  /* ============================================================
     CENA 5 — ONDA PARAMÉTRICA
     ============================================================ */
  function cenaOnda(){
    var scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(OBSIDIANA, 0.05);
    var cam = novaCamera(0);
    cam.position.set(0, 4.2, 9);
    cam.lookAt(0, 0, 0);

    var mat = new THREE.ShaderMaterial({
      uniforms: { u_t: { value: 0 }, u_a: { value: new THREE.Color(AMBAR) }, u_b: { value: new THREE.Color(VIRIDIANA) } },
      wireframe: true, transparent: true,
      vertexShader: [
        "uniform float u_t; varying float vH; varying float vR;",
        "void main(){",
        "  vec3 p = position;",
        "  float r = length(p.xy);",
        "  float h = sin(r * 1.4 - u_t * 2.0) * 0.9 / (1.0 + r * 0.28);",
        "  h += sin(p.x * 0.7 + u_t * 0.8) * 0.22 + cos(p.y * 0.6 - u_t * 0.6) * 0.22;",
        "  p.z = h; vH = h; vR = r;",
        "  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);",
        "}"
      ].join("\n"),
      fragmentShader: [
        "uniform vec3 u_a; uniform vec3 u_b; varying float vH; varying float vR;",
        "void main(){",
        "  vec3 cor = mix(u_b, u_a, clamp(vH * 0.8 + 0.5, 0.0, 1.0));",
        "  float alfa = clamp(1.0 - vR * 0.1, 0.06, 1.0);",
        "  gl_FragColor = vec4(cor, alfa);",
        "}"
      ].join("\n")
    });

    var plano = new THREE.Mesh(new THREE.PlaneGeometry(16, 16, 120, 120), mat);
    plano.rotation.x = -Math.PI / 2.35;
    scene.add(plano, pontosEsfericos(700, 10, 0.03, NEVOA));

    return { scene: scene, camera: cam, update: function(t){
      mat.uniforms.u_t.value = t;
      plano.rotation.z = t * 0.05;
      cam.position.y = 4.2 + Math.sin(t * 0.25) * 1.2;
      cam.position.x = Math.sin(t * 0.17) * 2.4;
      cam.lookAt(0, 0, 0);
    }};
  }

  /* ============================================================
     CENA 6 — PILARES NA NÉVOA
     ============================================================ */
  function cenaNevoa(){
    var scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(OBSIDIANA, 0.055);
    var cam = novaCamera(0);
    cam.position.set(0, 1.6, 10);

    var grupo = new THREE.Group();

    var pilares = [];

      var lado = i % 2 === 0 ? 1 : -1;

      pilares.push(m);
      grupo.add(m);
    }
    var farol = new THREE.PointLight(AMBAR, 4.5, 26);

    );

    return { scene: scene, camera: cam, update: function(t){

      cam.position.z = z;
      cam.position.x = Math.sin(t * 0.35) * 1.4;
      cam.position.y = 1.6 + Math.sin(t * 0.5) * 0.35;
      cam.lookAt(Math.sin(t * 0.2) * 2, 1.2, z - 12);
      farol.position.set(Math.sin(t * 0.8) * 5, 4, z - 7);
      farolVerde.position.set(-Math.sin(t * 0.6) * 6, 1.5, z - 14);
      for (var i = 0; i < pilares.length; i += 7){
        pilares[i].rotation.y = t * 0.15 + i;
      }
    }};
  }

  /* ============================================================
     CENA 7 — CONVERGÊNCIA EM TEXTO
     ============================================================ */
  function amostrarTexto(texto, n){
    var c = document.createElement("canvas");
    c.width = 512; c.height = 128;
    var ctx = c.getContext("2d");
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = "#fff";
    ctx.font = "700 84px Georgia, 'Times New Roman', serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(texto, c.width / 2, c.height / 2 + 4);
    var dados = ctx.getImageData(0, 0, c.width, c.height).data;
    var validos = [];
    for (var y = 0; y < c.height; y += 1){
      for (var x = 0; x < c.width; x += 1){
        if (dados[(y * c.width + x) * 4] > 128) validos.push([x, y]);
      }
    }
    var alvos = new Float32Array(n * 3);
    for (var i = 0; i < n; i++){
      var p = validos.length ? validos[(Math.random() * validos.length) | 0] : [256, 64];
      alvos[i * 3]     = (p[0] / c.width - 0.5) * 10.5 + 1.6;
      alvos[i * 3 + 1] = -(p[1] / c.height - 0.5) * 2.5 - 2.4;
      alvos[i * 3 + 2] = (Math.random() - 0.5) * 0.45;
    }
    return alvos;
  }

  function cenaConvergencia(){
    var scene = new THREE.Scene();
    var cam = novaCamera(9.5);

    var N = 18000;
    var inicio = new Float32Array(N * 3), pos = new Float32Array(N * 3), rnd = new Float32Array(N);
    for (var i = 0; i < N; i++){
      var u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u);
      var r = 6 + Math.random() * 5;
      inicio[i * 3] = r * s * Math.cos(th);
      inicio[i * 3 + 1] = r * s * Math.sin(th);
      inicio[i * 3 + 2] = r * u;
      pos[i * 3] = inicio[i * 3]; pos[i * 3 + 1] = inicio[i * 3 + 1]; pos[i * 3 + 2] = inicio[i * 3 + 2];
      rnd[i] = Math.random();
    }
    var alvos = amostrarTexto("OBRIGADO", N);

    var g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    g.setAttribute("aRnd", new THREE.BufferAttribute(rnd, 1));
    var mat = new THREE.ShaderMaterial({
      uniforms: {
        u_px: { value: renderer.getPixelRatio() },
        u_t: { value: 0 },
        u_a: { value: new THREE.Color(AMBAR) },
        u_b: { value: new THREE.Color(VIRIDIANA) }
      },
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      vertexShader: [
        "uniform float u_px; uniform float u_t; attribute float aRnd; varying float vR;",
        "void main(){",
        "  vR = aRnd;",
        "  vec4 mv = modelViewMatrix * vec4(position, 1.0);",
        "  gl_PointSize = (16.0 + aRnd * 24.0) * u_px / -mv.z;",
        "  gl_Position = projectionMatrix * mv;",
        "}"
      ].join("\n"),
      fragmentShader: [
        "uniform vec3 u_a; uniform vec3 u_b; varying float vR;",
        "void main(){",
        "  float d = length(gl_PointCoord - 0.5);",
        "  if (d > 0.5) discard;",
        "  vec3 cor = mix(u_a, u_b, vR);",
        "  gl_FragColor = vec4(cor, smoothstep(0.5, 0.0, d) * 0.9);",
        "}"
      ].join("\n")
    });
    var nuvem = new THREE.Points(g, mat);
    scene.add(nuvem);

    var t0 = null;
    return { scene: scene, camera: cam, reiniciar: function(){ t0 = null; }, update: function(t){
      if (t0 === null) t0 = reduzir ? t - 3 : t;
      var k = Math.min(1, (t - t0) / 2.6);
      var e = 1 - Math.pow(1 - k, 3);
      var arr = g.attributes.position.array;
      for (var i = 0; i < N; i++){
        var i3 = i * 3;
        var atraso = Math.min(1, Math.max(0, e * 1.35 - rnd[i] * 0.35));
        var ondul = Math.sin(t * 1.6 + rnd[i] * 6.28) * 0.06 * (1 - atraso * 0.7);
        arr[i3]     = inicio[i3] + (alvos[i3] - inicio[i3]) * atraso;
        arr[i3 + 1] = inicio[i3 + 1] + (alvos[i3 + 1] - inicio[i3 + 1]) * atraso + ondul;
        arr[i3 + 2] = inicio[i3 + 2] + (alvos[i3 + 2] - inicio[i3 + 2]) * atraso;
      }
      g.attributes.position.needsUpdate = true;
      mat.uniforms.u_t.value = t;
      nuvem.rotation.y = Math.sin(t * 0.25) * 0.22 * (1 - e) + Math.sin(t * 0.4) * 0.05 * e;
      cam.position.z = 9.5 + (1 - e) * 3;
    }};
  }

  /* ============================================================
     ORQUESTRAÇÃO
     ============================================================ */
  var fabricas = [cenaNo, cenaMalha, cenaRuido, cenaInstancias, cenaEspiral, cenaOnda, cenaNevoa, cenaConvergencia];
  var cenas = new Array(fabricas.length);

  function obterCena(i){
    if (!cenas[i]) cenas[i] = fabricas[i]();
    if (cenas[i].reiniciar) cenas[i].reiniciar();
    return cenas[i];
  }

  var indice = 0;
  var atual = obterCena(0);
  var trocando = false;

  function irPara(i, imediato){
    i = (i + slides.length) % slides.length;
    if (i === indice && !imediato) return;
    if (trocando) return;
    trocando = true;
    var atrasoCorte = (reduzir || imediato) ? 0 : 260;
    if (atrasoCorte) corte.classList.add("ativo");
    window.setTimeout(function(){
      indice = i;
      atual = obterCena(i);
      artigos.forEach(function(a, j){ a.classList.toggle("slide-ativo", j === i); });
      botoesMarca.forEach(function(b, j){ b.setAttribute("aria-current", j === i ? "true" : "false"); });
      contador.textContent = ("0" + (i + 1)).slice(-2) + " / 0" + slides.length;
      barra.style.width = ((i + 1) / slides.length * 100) + "%";
      pintarTelemetria(i);
      precisaAtualizar = true;
      fpsEl = document.getElementById("fps");
      redimensionar();
      corte.classList.remove("ativo");
      trocando = false;
    }, atrasoCorte);
  }

  document.getElementById("proximo").addEventListener("click", function(){ irPara(indice + 1); });
  document.getElementById("anterior").addEventListener("click", function(){ irPara(indice - 1); });

  document.addEventListener("keydown", function(ev){
    if (ev.key === "ArrowRight" || ev.key === "PageDown" || ev.key === " "){ ev.preventDefault(); irPara(indice + 1); }
    else if (ev.key === "ArrowLeft" || ev.key === "PageUp"){ ev.preventDefault(); irPara(indice - 1); }
    else if (ev.key === "Home"){ irPara(0); }
    else if (ev.key === "End"){ irPara(slides.length - 1); }
    else if (ev.key.toLowerCase() === "a"){ alternarAuto(); }
  });

  var toqueX = null;
  window.addEventListener("touchstart", function(ev){ toqueX = ev.changedTouches[0].clientX; }, { passive: true });
  window.addEventListener("touchend", function(ev){
    if (toqueX === null) return;
    var dx = ev.changedTouches[0].clientX - toqueX;
    if (Math.abs(dx) > 55) irPara(indice + (dx < 0 ? 1 : -1));
    toqueX = null;
  }, { passive: true });

  /* autoplay */
  var botaoAuto = document.getElementById("auto");
  var timerAuto = null;
  function alternarAuto(){
    if (timerAuto){
      clearInterval(timerAuto); timerAuto = null;
      botaoAuto.setAttribute("aria-pressed", "false");
    } else {
      timerAuto = setInterval(function(){ irPara(indice + 1); }, 9000);
      botaoAuto.setAttribute("aria-pressed", "true");
    }
  }
  botaoAuto.addEventListener("click", alternarAuto);

  /* ============================================================
     LOOP
     ============================================================ */
  function redimensionar(){
    largura = window.innerWidth; altura = window.innerHeight;
    renderer.setSize(largura, altura, false);
    for (var i = 0; i < cenas.length; i++){
      if (cenas[i]){ cenas[i].camera.aspect = largura / altura; cenas[i].camera.updateProjectionMatrix(); }
    }
  }
  window.addEventListener("resize", redimensionar);

  var fpsEl = null, quadros = 0, marcoFps = 0, precisaAtualizar = true, relogio = new THREE.Clock();

  function laco(){
    requestAnimationFrame(laco);
    var t = relogio.getElapsedTime();
    if (!reduzir) atual.update(t);
    else if (precisaAtualizar){ atual.update(t); precisaAtualizar = false; }
    renderer.render(atual.scene, atual.camera);

    quadros++;
    var agora = performance.now();
    if (agora - marcoFps > 500){
      if (fpsEl) fpsEl.textContent = Math.round(quadros * 1000 / (agora - marcoFps)) + " fps";
      quadros = 0; marcoFps = agora;
    }
  }

  irPara(0, true);
  marcoFps = performance.now();
  laco();
})();
</script>
